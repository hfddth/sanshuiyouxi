services:
  - type: web
    name: sanshuiyouxi-agent
    runtime: docker
    rootDir: agent
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: ALLOWED_ORIGINS
        value: https://hfddth.github.io
