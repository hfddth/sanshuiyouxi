name: Agent CI

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "app.js"
      - "agent-config.js"
      - ".github/workflows/agent-ci.yml"
  pull_request:
    paths:
      - "agent/**"
      - "app.js"
      - "agent-config.js"
      - ".github/workflows/agent-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r agent/requirements.txt pytest httpx
      - name: Compile Python
        run: python -m compileall -q agent
      - name: Run Agent tests
        working-directory: agent
        run: pytest -q
      - name: Check browser JavaScript
        run: node --check app.js
      - name: Build Railway image
        run: docker build --tag sanshui-agent:ci agent
